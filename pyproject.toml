[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pre_commit_hook_collection"
version = "0.1.0"
description = "Collection of pre commit hooks."
readme = "README.md"
requires-python = ">=3.8,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "Christian Ditscher", email = "chris@ditscher.me" },
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
keywords = ["pre-commit", "git", "hooks", "python"]
urls = { "Homepage" = "https://github.com/ditschi/pre-commit-hooks" }
dependencies = []

[project.scripts]
protect-files = "pre_commit_hook_collection.protect_files:main"

[project.optional-dependencies]
dev = [
  "bandit",
  "black",
  "build",
  "covdefaults",
  "coverage",
  "flake8",
  "isort",
  "lxml",
  "mccabe",
  "mypy",
  "pylint",
  "pyroma",
  "pytest",
  "pytest-html",
  "pytest-mock",
  "radon",
  "twine",
  "typing-extensions",
  "uv",
  "nox[pbs]",
  "pip-tools",
  "vulture",
  "dill",
  "pre-commit==3.5.0",
]

[tool.setuptools.packages.find]
exclude = ["tests*", "testing*"]
